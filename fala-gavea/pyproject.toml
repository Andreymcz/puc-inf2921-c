[project]
name = "fala-gavea"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.35",
    "httpx>=0.27",
    "pandas>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5",
    "scikit-learn>=1.5",
    "plotly>=5.0",
    "einops>=0.8",
    "torchvision>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fala_gavea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "pytest>=9.0.3",
]
