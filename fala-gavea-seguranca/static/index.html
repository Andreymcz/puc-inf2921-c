<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fala Gávea – Segurança</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Fala Gávea</h1>
      <p class="subtitle">Segurança Pública</p>
    </div>

    <div id="filters">
      <h2>Filtros</h2>
      <label>Categoria
        <select id="filter-category">
          <option value="">Todas</option>
          <option value="furto_roubo">Furto / Roubo</option>
          <option value="iluminacao">Iluminação</option>
          <option value="transito">Trânsito</option>
          <option value="espaco_publico_inseguro">Espaço público inseguro</option>
          <option value="vandalismo">Vandalismo</option>
          <option value="moradores_situacao_rua">Moradores em situação de rua</option>
          <option value="conflito_social">Conflito / Tensão comunitária</option>
          <option value="barulho_perturbacao">Barulho / Perturbação</option>
          <option value="outro">Outro</option>
        </select>
      </label>
      <label>Status
        <select id="filter-status">
          <option value="">Todos</option>
          <option value="pendente">Pendente</option>
          <option value="em_analise">Em análise</option>
          <option value="resolvido">Resolvido</option>
        </select>
      </label>
      <label>De
        <input type="date" id="filter-date-from" />
      </label>
      <label>Até
        <input type="date" id="filter-date-to" />
      </label>
      <label>Tag
        <input type="text" id="filter-tag" placeholder="ex: perigoso" />
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="filter-bbox" />
        Somente área visível
      </label>
      <button id="btn-apply-filters">Aplicar</button>
    </div>

    <div id="search-panel">
      <h2>Busca Semântica</h2>
      <div class="search-row">
        <input type="text" id="search-q" placeholder="Descreva o que procura..." />
        <button id="btn-search">🔍</button>
      </div>
      <button id="btn-clear-search" class="secondary hidden">✕ Limpar busca</button>
    </div>

    <div id="iluminacao-panel">
      <h2>Iluminação Pública</h2>
      <button id="btn-refresh-iluminacao">🔄 Atualizar dataset</button>
      <p id="iluminacao-status" class="hint"></p>
    </div>

    <div id="report-list">
      <h2>Relatos <span id="report-count"></span></h2>
      <ul id="reports-ul"></ul>
    </div>

    <div id="form-panel" class="hidden">
      <h2>Novo Relato</h2>
      <form id="report-form">
        <label>Descrição *
          <textarea id="f-text" rows="3" required minlength="5"></textarea>
        </label>
        <label>Categoria *
          <select id="f-category" required>
            <option value="furto_roubo">Furto / Roubo</option>
            <option value="iluminacao">Iluminação</option>
            <option value="transito">Trânsito</option>
            <option value="espaco_publico_inseguro">Espaço público inseguro</option>
            <option value="vandalismo">Vandalismo</option>
            <option value="moradores_situacao_rua">Moradores em situação de rua</option>
            <option value="conflito_social">Conflito / Tensão comunitária</option>
            <option value="barulho_perturbacao">Barulho / Perturbação</option>
            <option value="outro">Outro</option>
          </select>
        </label>
        <label>Bairro / Logradouro
          <input id="f-territory" type="text" placeholder="ex: Gávea, Rua X" />
        </label>
        <label>Tags (separe por vírgulas)
          <input id="f-tags" type="text" placeholder="ex: perigoso, noite, esquina" />
        </label>
        <input type="hidden" id="f-lat" />
        <input type="hidden" id="f-lon" />
        <p id="f-coords-hint" class="hint">Clique no mapa para definir a localização.</p>
        <div class="form-buttons">
          <button type="submit" id="btn-submit">Enviar</button>
          <button type="button" id="btn-cancel">Cancelar</button>
        </div>
        <p id="f-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <div id="map"></div>

  <button id="btn-new-report">+ Novo Relato</button>
  <a href="/static/chat.html" id="btn-chat">💬 Chat do Delegado</a>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
